name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pip
      - run: pip install flask pytest
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
        working-directory: tests/js
